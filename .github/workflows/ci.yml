name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java (required for Firebase emulators)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Lint
        working-directory: functions
        run: npm run lint

      - name: Build
        working-directory: functions
        run: npm run build

      - name: Start Firebase emulators and run tests
        working-directory: functions
        env:
          FIREBASE_AUTH_EMULATOR_HOST: "localhost:9099"
          FIRESTORE_EMULATOR_HOST: "localhost:8080"
          FIREBASE_STORAGE_EMULATOR_HOST: "localhost:9199"
          GCLOUD_PROJECT: "gffft-auth"
        run: |
          firebase emulators:exec --project gffft-auth "npm run test:coverage"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-report
          path: functions/coverage/
          retention-days: 7

  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java (required for Firebase emulators)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Build
        working-directory: functions
        run: npm run build

      - name: Start Firebase emulators and run tests with coverage
        working-directory: functions
        env:
          FIREBASE_AUTH_EMULATOR_HOST: "localhost:9099"
          FIRESTORE_EMULATOR_HOST: "localhost:8080"
          FIREBASE_STORAGE_EMULATOR_HOST: "localhost:9199"
          GCLOUD_PROJECT: "gffft-auth"
        run: |
          firebase emulators:exec --project gffft-auth "npm run test:coverage"

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonar.villagecompute.com
