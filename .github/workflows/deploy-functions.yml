name: Firebase function deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GFFFT_AUTH }}

      - name: Deploy to Firebase
        working-directory: functions
        run: npx firebase-tools deploy --only functions --project gffft-auth
        env:
          REDIS_HOST: 10.114.171.4
          REDIS_PORT: 6378
          REDIS_PASSWORD: 70bea022-a9d1-4254-96ab-6b6b8c348d98
