# SonarQube configuration (self-hosted)
sonar.projectKey=gffft-server
sonar.host.url=https://sonar.villagecompute.com

# Project info
sonar.projectName=gffft-server

# Source directories
sonar.sources=functions/src

# Exclusions
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/node_modules/**

# TypeScript configuration
sonar.typescript.tsconfigPaths=functions/tsconfig.json

# Coverage
sonar.javascript.lcov.reportPaths=functions/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
